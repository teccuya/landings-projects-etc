<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Змейка</title>
<style>
  :root{
    --bg: #0c1210;
    --grid: #12211b;
    --neon: #4dff8a;
    --neon-dim: #1f7a45;
    --amber: #ffb703;
    --red: #ff4d4d;
    --panel: #0f1a15;
    --scanline: rgba(77,255,138,0.035);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    min-height:100%;
    background: var(--bg);
    font-family: 'Courier New', monospace;
    color: var(--neon);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    touch-action: manipulation;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background: repeating-linear-gradient(
      to bottom,
      var(--scanline) 0px,
      var(--scanline) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events:none;
    z-index: 10;
  }

  .cabinet{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 32px 22px;
    background: linear-gradient(180deg, #16241d 0%, #0d1712 100%);
    border-radius: 18px;
    box-shadow:
      0 0 0 2px #1f3a2b,
      0 0 40px rgba(77,255,138,0.15),
      inset 0 0 30px rgba(0,0,0,0.6);
    margin: 16px;
  }

  h1{
    margin: 0 0 4px;
    font-size: 28px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--neon);
    text-shadow: 0 0 8px var(--neon), 0 0 18px rgba(77,255,138,0.5);
  }

  .subtitle{
    margin: 0 0 16px;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--neon-dim);
    text-transform: uppercase;
  }

  .hud{
    display:flex;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    margin-bottom: 10px;
    font-size: 13px;
    letter-spacing: 2px;
  }

  .hud span.value{
    color: var(--amber);
    text-shadow: 0 0 6px rgba(255,183,3,0.6);
  }

  #gameCanvas{
    background: var(--grid);
    border: 2px solid var(--neon-dim);
    box-shadow:
      0 0 20px rgba(77,255,138,0.15) inset,
      0 0 15px rgba(77,255,138,0.2);
    image-rendering: pixelated;
    max-width: 90vw;
    height: auto;
    touch-action: none;
  }

  .footer{
    margin-top: 14px;
    font-size: 11px;
    color: var(--neon-dim);
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.6;
  }

  .footer b{ color: var(--neon); }

  .overlay{
    position:absolute;
    inset: 0;
    display:none;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    background: rgba(5,10,8,0.88);
    border-radius: 18px;
    z-index: 5;
    text-align:center;
    padding: 20px;
  }

  .overlay.show{ display:flex; }

  .overlay h2{
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--red);
    text-shadow: 0 0 10px var(--red);
    margin: 0 0 8px;
    animation: flicker 1.4s infinite;
  }

  .overlay p{
    margin: 4px 0;
    font-size: 13px;
    letter-spacing: 2px;
  }

  .overlay .score-final{
    color: var(--amber);
    font-size: 16px;
    margin: 10px 0 18px;
  }

  .overlay button{
    background: transparent;
    border: 2px solid var(--neon);
    color: var(--neon);
    font-family: inherit;
    padding: 10px 22px;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all .15s ease;
  }

  .overlay button:hover{
    background: var(--neon);
    color: #05100a;
    box-shadow: 0 0 20px var(--neon);
  }

  .start-msg{
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--neon-dim);
    margin-top: 6px;
    animation: blink 1.2s steps(2) infinite;
  }

  @keyframes blink{ 50%{ opacity: 0; } }
  @keyframes flicker{
    0%, 100% { opacity: 1; }
    45% { opacity: 1; }
    50% { opacity: 0.4; }
    55% { opacity: 1; }
  }

  .canvas-wrap{ position: relative; }

  /* on-screen mobile controls (d-pad) */
  .touch-controls{
    display: none;
    margin-top: 18px;
    user-select: none;
  }

  .touch-controls .row{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .touch-controls button{
    width: 56px;
    height: 56px;
    background: rgba(77,255,138,0.06);
    border: 2px solid var(--neon-dim);
    color: var(--neon);
    font-size: 22px;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action: manipulation;
  }

  .touch-controls button:active{
    background: var(--neon);
    color: #05100a;
    box-shadow: 0 0 16px var(--neon);
  }

  /* show d-pad on touch devices / narrow screens */
  @media (hover: none) and (pointer: coarse){
    .touch-controls{ display:block; }
  }

  @media (max-width: 520px){
    h1{ font-size: 20px; letter-spacing: 5px; }
    .cabinet{ padding: 16px 14px 14px; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <h1>Змейка</h1>
  <p class="subtitle">— arcade edition —</p>

  <div class="hud">
    <div>СЧЁТ: <span class="value" id="score">0</span></div>
    <div>РЕКОРД: <span class="value" id="highscore">0</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="overlay show" id="startOverlay">
      <h2>ЗМЕЙКА</h2>
      <p>Стрелки / WASD / свайп / кнопки ниже</p>
      <p class="start-msg">Нажми пробел или кнопку, чтобы начать</p>
    </div>

    <div class="overlay" id="gameOverOverlay">
      <h2>ИГРА ОКОНЧЕНА</h2>
      <p class="score-final">Счёт: <span id="finalScore">0</span></p>
      <button id="restartBtn">Играть снова</button>
    </div>
  </div>

  <div class="touch-controls" id="touchControls">
    <div class="row">
      <button data-dir="up">▲</button>
    </div>
    <div class="row">
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>
  </div>

  <p class="footer">Собирай <b>●</b> и расти. Не врезайся в стены или в себя.</p>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restartBtn');
  const touchControls = document.getElementById('touchControls');

  const GRID = 20;
  const CELLS = canvas.width / GRID; // 20x20
  const BASE_SPEED = 130; // ms per tick, gets faster
  const MIN_SPEED = 65;

  let snake, dir, nextDir, food, score, speed, running, loopId, started;
  let highscore = Number(localStorage.getItem('snake_highscore') || 0);
  highscoreEl.textContent = highscore;

  function resetState(){
    snake = [
      {x: 8, y: 10},
      {x: 7, y: 10},
      {x: 6, y: 10}
    ];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = BASE_SPEED;
    running = true;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood(){
    let valid = false;
    while(!valid){
      food = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS)
      };
      valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
    }
  }

  function drawCell(x, y, color, glow){
    ctx.fillStyle = color;
    if(glow){
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
    } else {
      ctx.shadowBlur = 0;
    }
    const pad = 1;
    ctx.fillRect(x*GRID+pad, y*GRID+pad, GRID-pad*2, GRID-pad*2);
    ctx.shadowBlur = 0;
  }

  function drawGrid(){
    ctx.fillStyle = '#12211b';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(77,255,138,0.05)';
    ctx.lineWidth = 1;
    for(let i=0;i<=CELLS;i++){
      ctx.beginPath();
      ctx.moveTo(i*GRID, 0);
      ctx.lineTo(i*GRID, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i*GRID);
      ctx.lineTo(canvas.width, i*GRID);
      ctx.stroke();
    }
  }

  function draw(){
    drawGrid();

    // food
    ctx.beginPath();
    const fx = food.x*GRID + GRID/2;
    const fy = food.y*GRID + GRID/2;
    ctx.fillStyle = '#ffb703';
    ctx.shadowColor = '#ffb703';
    ctx.shadowBlur = 10;
    ctx.arc(fx, fy, GRID/2 - 3, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // snake
    snake.forEach((seg, i) => {
      const color = i === 0 ? '#7dffb0' : '#4dff8a';
      drawCell(seg.x, seg.y, color, i === 0);
    });
  }

  function tick(){
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if(head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS){
      return gameOver();
    }
    // self collision
    if(snake.some(seg => seg.x === head.x && seg.y === head.y)){
      return gameOver();
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      speed = Math.max(MIN_SPEED, speed - 3);
    } else {
      snake.pop();
    }

    draw();
  }

  function loop(){
    if(!running) return;
    tick();
    if(running){
      loopId = setTimeout(loop, speed);
    }
  }

  function gameOver(){
    running = false;
    clearTimeout(loopId);
    if(score > highscore){
      highscore = score;
      localStorage.setItem('snake_highscore', highscore);
      highscoreEl.textContent = highscore;
    }
    finalScoreEl.textContent = score;
    gameOverOverlay.classList.add('show');
  }

  function startGame(){
    started = true;
    startOverlay.classList.remove('show');
    gameOverOverlay.classList.remove('show');
    resetState();
    draw();
    clearTimeout(loopId);
    loop();
  }

  const KEY_MAP = {
    ArrowUp: {x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
    W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0}
  };

  function setDirection(name){
    const map = {
      up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0}
    };
    const newDir = map[name];
    if(!newDir) return;

    if(!started || !running){
      startGame();
      nextDir = newDir;
      return;
    }
    if(newDir.x === -dir.x && newDir.y === -dir.y) return;
    nextDir = newDir;
  }

  window.addEventListener('keydown', (e) => {
    if(e.key === ' '){
      e.preventDefault();
      if(!started || !running){
        startGame();
      }
      return;
    }

    const newDir = KEY_MAP[e.key];
    if(!newDir || !running) return;
    e.preventDefault();

    // prevent reversing directly into itself
    if(newDir.x === -dir.x && newDir.y === -dir.y) return;
    nextDir = newDir;
  });

  restartBtn.addEventListener('click', startGame);

  // on-screen d-pad buttons
  touchControls.querySelectorAll('button[data-dir]').forEach(btn => {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      setDirection(btn.dataset.dir);
    }, {passive:false});
    btn.addEventListener('click', (e) => {
      setDirection(btn.dataset.dir);
    });
  });

  // simple swipe support for mobile (swiping directly on the canvas)
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = e.touches[0];
  }, {passive:true});
  canvas.addEventListener('touchend', (e) => {
    if(!touchStart) return;
    if(!started || !running){ startGame(); touchStart = null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.clientX;
    const dy = t.clientY - touchStart.clientY;

    if(Math.abs(dx) < 20 && Math.abs(dy) < 20){ touchStart = null; return; } // ignore tiny taps

    let newDir;
    if(Math.abs(dx) > Math.abs(dy)){
      newDir = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
    } else {
      newDir = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
    }
    if(!(newDir.x === -dir.x && newDir.y === -dir.y)){
      nextDir = newDir;
    }
    touchStart = null;
  }, {passive:true});

  // tapping the start/game-over overlay also starts the game (mobile-friendly)
  startOverlay.addEventListener('click', () => { if(!started) startGame(); });

  // initial draw before game starts
  resetState();
  draw();
})();
</script>

</body>
</html>
